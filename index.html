<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>车贷管家</title>
<style>
  :root{
    --bg: #F3F3F3;
    --card: rgba(255,255,255,0.75);
    --border: rgba(0,0,0,0.07);
    --text-primary: #1B1B1B;
    --text-secondary: #5D5D5D;
    --accent: #0067C0;
    --accent-hover: #005A9E;
    --accent-soft: rgba(0,103,192,0.10);
    --success: #107C10;
    --danger: #C42B1C;
    --radius-card: 10px;
    --radius-ctrl: 6px;

    --surface-window: rgba(255,255,255,0.55);
    --surface-window-border: rgba(255,255,255,0.6);
    --surface-strong: rgba(255,255,255,0.45);
    --input-bg: rgba(255,255,255,0.9);
    --input-border: rgba(0,0,0,0.14);
    --ghost-bg: rgba(0,0,0,0.035);
    --ghost-border: rgba(0,0,0,0.10);
    --ghost-hover: rgba(0,0,0,0.06);
    --modal-bg: #FAFAFA;
    --chip-bg: rgba(0,0,0,0.04);
    --ring-track: rgba(0,0,0,0.07);
  }
  body.dark{
    --bg: #1D1D1D;
    --card: rgba(45,45,45,0.65);
    --border: rgba(255,255,255,0.09);
    --text-primary: #F3F3F3;
    --text-secondary: #B8B8B8;
    --accent: #3AA0F0;
    --accent-hover: #5CB3F5;
    --accent-soft: rgba(58,160,240,0.18);
    --success: #6CCB5F;
    --danger: #FF99A4;

    --surface-window: rgba(32,32,32,0.65);
    --surface-window-border: rgba(255,255,255,0.08);
    --surface-strong: rgba(32,32,32,0.55);
    --input-bg: rgba(255,255,255,0.06);
    --input-border: rgba(255,255,255,0.16);
    --ghost-bg: rgba(255,255,255,0.06);
    --ghost-border: rgba(255,255,255,0.14);
    --ghost-hover: rgba(255,255,255,0.10);
    --modal-bg: #2B2B2B;
    --chip-bg: rgba(255,255,255,0.08);
    --ring-track: rgba(255,255,255,0.10);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(0,103,192,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(0,103,192,0.06), transparent 55%),
      var(--bg);
    font-family: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    transition: background-color .2s ease, color .2s ease;
  }
  .app-window{
    height: 100vh;
    display:flex; flex-direction:column;
  }
  .titlebar{
    display:flex; align-items:center; gap:10px;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-strong);
    flex-shrink:0;
  }
  .titlebar .icon{
    width:28px; height:28px; border-radius:7px;
    background: linear-gradient(135deg, #0067C0, #2B88D8);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .titlebar .icon svg{ width:16px; height:16px; }
  .titlebar h1{
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    font-size: 15px; font-weight:600; margin:0; letter-spacing:.1px;
  }
  .titlebar .plate-chip{
    margin-left:auto;
    font-size:13px; color:var(--text-secondary);
    background: var(--chip-bg);
    border:1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
  }
  .theme-toggle{
    width: 30px; height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--ghost-bg);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    color: var(--text-secondary);
    padding:0;
  }
  .theme-toggle:hover{ background: var(--ghost-hover); }
  .theme-toggle svg{ width:16px; height:16px; }
  .theme-toggle .icon-sun{ display:none; }
  body.dark .theme-toggle .icon-moon{ display:none; }
  body.dark .theme-toggle .icon-sun{ display:block; }

  body:not(.authed) .app-window{ display:none; }
  body.authed .auth-screen{ display:none; }

  .auth-screen{
    position: fixed; inset: 0;
    display:flex; align-items:center; justify-content:center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  .auth-card{
    width: 100%; max-width: 340px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
  }
  .auth-logo{
    width:44px; height:44px; border-radius:11px;
    background: linear-gradient(135deg, #0067C0, #2B88D8);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 14px;
  }
  .auth-logo svg{ width:24px; height:24px; }
  .auth-title{
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    font-size: 18px; font-weight:700; text-align:center; margin: 0 0 4px;
  }
  .auth-sub{
    text-align:center; font-size:12.5px; color: var(--text-secondary);
    margin: 0 0 20px;
  }
  .btn-google{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text-primary);
    padding: 9px 16px;
    font-size: 13.5px; font-weight:600;
  }
  .btn-google:hover{ background: var(--ghost-hover); }
  .auth-divider{
    display:flex; align-items:center; text-align:center;
    color: var(--text-secondary); font-size:12px;
    margin: 16px 0;
  }
  .auth-divider::before, .auth-divider::after{
    content:""; flex:1; height:1px; background: var(--border);
  }
  .auth-divider span{ padding: 0 10px; }
  .auth-options{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:10px; font-size:12.5px;
  }
  .keep-signed-in{ display:flex; align-items:center; gap:7px; color:var(--text-secondary); user-select:none; }
  .keep-signed-in input{ width:15px; height:15px; margin:0; cursor:pointer; accent-color:#0067C0; }
  .forgot-password{ color:#0067C0; text-decoration:none; font-weight:600; cursor:pointer; white-space:nowrap; }
  .forgot-password:hover{ text-decoration:underline; }
  body.dark .forgot-password{ color:#60a5fa; }
  .password-wrap{ position:relative; }
  .password-wrap input{ padding-right:44px; }
  .password-eye{
    position:absolute; right:5px; top:50%; transform:translateY(-50%);
    width:34px; height:32px; padding:0; border:0; background:transparent;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary); cursor:pointer; border-radius:5px;
  }
  .password-eye:hover{ background:var(--ghost-hover); }
  .password-eye:active{ transform:translateY(-50%); }
  .password-eye, .password-eye svg{ transition:none !important; animation:none !important; }
  .password-eye svg{ width:20px; height:20px; pointer-events:none; }
  .language-toggle{
    min-width:48px; height:30px; padding:0 9px; border-radius:7px;
    border:1px solid var(--border); background:var(--ghost-bg); color:var(--text-primary);
    font-size:12px; font-weight:700; cursor:pointer;
  }
  .language-toggle:hover{ background:var(--ghost-hover); }
  .auth-language-row{ display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:-10px -6px 8px 0; }
  .auth-error{
    margin-top: 14px; font-size:12.5px; color: var(--danger);
    min-height: 1px;
    white-space: pre-wrap; word-break: break-all;
  }

  .content{ padding: 22px 24px calc(28px + env(safe-area-inset-bottom)); overflow-y:auto; flex:1; -webkit-overflow-scrolling: touch; }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card h2{
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    font-size: 13px; font-weight:600; color: var(--text-secondary);
    margin: 0 0 14px 0;
  }

  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block; font-size:12.5px; color: var(--text-secondary); margin-bottom:5px;
  }
  .field input{
    width:100%;
    font-family: inherit; font-size: 14px;
    padding: 8px 11px;
    border-radius: var(--radius-ctrl);
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-primary);
    outline: none;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .field input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }

  button{
    font-family: inherit; font-size: 13.5px; font-weight:600;
    padding: 8px 16px;
    border-radius: var(--radius-ctrl);
    border: 1px solid transparent;
    cursor:pointer;
    transition: background .12s ease, transform .05s ease;
  }
  button:active{ transform: scale(0.98); }
  .btn-accent{ background: var(--accent); color:#fff; }
  .btn-accent:hover{ background: var(--accent-hover); }
  .btn-ghost{
    background: var(--ghost-bg);
    color: var(--text-primary);
    border-color: var(--ghost-border);
  }
  .btn-ghost:hover{ background: var(--ghost-hover); }
  .btn-danger-text{
    background: transparent; color: var(--danger);
    padding: 5px 9px; font-weight:500; font-size:12.5px;
  }
  .btn-danger-text:hover{ background: rgba(196,43,28,0.08); }
  .btn-edit-text{
    background: transparent; color: var(--accent);
    padding: 5px 9px; font-weight:500; font-size:12.5px;
  }
  .btn-edit-text:hover{ background: var(--accent-soft); }

  .actions{ display:flex; gap:10px; margin-top:14px; }

  .overview-top{ display:flex; align-items:center; gap:22px; }
  .ring-wrap{ position:relative; width:112px; height:112px; flex-shrink:0; }
  .ring-wrap svg{ transform: rotate(-90deg); width:112px; height:112px; }
  .ring-track{ fill:none; stroke: var(--ring-track); stroke-width:10; }
  .ring-progress{ fill:none; stroke: var(--accent); stroke-width:10; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .ring-label{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-label .pct{ font-size:20px; font-weight:700; }
  .ring-label .pct-sub{ font-size:10.5px; color:var(--text-secondary); }

  .stats{ flex:1; display:grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  .stat .k{ font-size:11.5px; color: var(--text-secondary); margin-bottom:2px; }
  .stat .v{ font-size:17px; font-weight:700; }
  .stat.remaining .v{ color: var(--accent); }
  .stat.paid .v{ color: var(--success); }
  .stat.payoff{
    padding-top: 10px;
    margin-top: 2px;
    border-top: 1px dashed var(--border);
  }
  .stat.payoff .v{ color: var(--accent); font-size: 18px; }

  .empty-state{
    text-align:center; padding: 30px 10px; color: var(--text-secondary); font-size:13.5px;
  }

  .history-item{
    display:flex; align-items:center; gap:12px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--border);
  }
  .history-item:last-child{ border-bottom:none; }
  .history-item .dot{
    width:8px; height:8px; border-radius:50%; background: var(--success); flex-shrink:0;
  }
  .history-item .info{ flex:1; min-width:0; }
  .history-item .date{ font-size:13px; font-weight:600; }
  .history-item .note{ font-size:12px; color: var(--text-secondary); margin-top:1px; }
  .history-item .amt{ font-size:14px; font-weight:700; color: var(--success); white-space:nowrap; }

  .settings-toggle{
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none;
  }
  .settings-toggle .chev{ transition: transform .15s ease; color: var(--text-secondary); }
  .settings-toggle.open .chev{ transform: rotate(180deg); }
  .settings-body{ display:none; margin-top:14px; }
  .settings-body.open{ display:block; }

  .toast{
    position: fixed; bottom: 24px; left:50%; transform: translateX(-50%) translateY(20px);
    background: #1B1B1B; color:#fff; font-size:13px;
    padding: 10px 18px; border-radius: 8px;
    opacity:0; pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 999;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.show{ display: flex; }
  .modal-box{
    width: 320px;
    background: var(--modal-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
  }
  .modal-title{
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    font-size: 15px; font-weight:700; margin-bottom: 8px;
  }
  .modal-message{
    font-size: 13.5px; color: var(--text-secondary); line-height:1.5; margin-bottom: 18px;
  }
  .modal-actions{
    display:flex; justify-content:flex-end; gap:10px;
  }

  .info-box{
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .info-box.ok{ color: var(--success); }
  .info-box.warn{ color: var(--danger); }
</style>

<style id="exact-user-file-colors">

    --bg: #F3F3F3;
    --card: rgba(255,255,255,0.75);
    --border: rgba(0,0,0,0.07);
    --text-primary: #1B1B1B;
    --text-secondary: #5D5D5D;
    --accent: #0067C0;
    --accent-hover: #005A9E;
    --accent-soft: rgba(0,103,192,0.10);
    --success: #107C10;
    --danger: #C42B1C;
    --radius-card: 10px;
    --radius-ctrl: 6px;

    --surface-window: rgba(255,255,255,0.55);
    --surface-window-border: rgba(255,255,255,0.6);
    --surface-strong: rgba(255,255,255,0.45);
    --input-bg: rgba(255,255,255,0.9);
    --input-border: rgba(0,0,0,0.14);
    --ghost-bg: rgba(0,0,0,0.035);
    --ghost-border: rgba(0,0,0,0.10);

    </div>

    <div class="card">

      <div class="row2">
        <div class="field">
          <label for="payAmount" data-i18n="paymentAmount">还款金额 (RM)</label>

        <button class="btn-ghost" id="cancelEditBtn" style="display:none;" data-i18n="cancelEdit">取消编辑</button>

    </div>

    <div class="card">

      <div id="historyList">
        <div class="empty-state" data-i18n="noPayments">还没有还款记录，添加第一笔吧。</div>
      </div>
    </div>

  </div>
</div>

</div>

function tr(key, vars={}){
  let text = (I18N[currentLanguage] && I18N[currentLanguage][key]) || I18N.cn[key] || key;
  Object.entries(vars).forEach(([k,v]) => { text = text.replaceAll(`{${k}}`, v); });
  return text;
}
function applyLanguage(lang){
  currentLanguage = lang === "en" ? "en" : "cn";
  localStorage.setItem(LANGUAGE_KEY, currentLanguage);
  document.documentElement.lang = currentLanguage === "en" ? "en" : "zh-CN";
  document.title = tr("appTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = tr(el.dataset.i18nPlaceholder); });
  const nextLabel = currentLanguage === "cn" ? "EN" : "CN";
  $("authLanguageBtn").textContent = nextLabel;
  $("mainLanguageBtn").textContent = nextLabel;
  const visible = $("authPassword").type === "text";
  $("passwordEyeBtn").setAttribute("aria-label", tr(visible ? "hidePassword" : "showPassword"));
  $("passwordEyeBtn").title = tr(visible ? "hidePassword" : "showPassword");
  applyTheme(state.theme || "light");
  if(auth.currentUser) $("accountEmailText").textContent = auth.currentUser.email ? `${tr("loggedIn")}: ${auth.currentUser.email}` : tr("loggedIn");
  render();
}

function fmt(n){
  return "RM " + Number(n||0).toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function applyTheme(theme){
  const resolvedTheme = theme === "dark" ? "dark" : "light";
  document.body.classList.toggle("dark", resolvedTheme === "dark");
  localStorage.setItem(THEME_KEY, resolvedTheme);
  const title = resolvedTheme === "dark" ? (currentLanguage === "en" ? "Switch to light mode" : "切换到亮色模式") : (currentLanguage === "en" ? "Switch to dark mode" : "切换到暗色模式");
  $("themeToggleBtn").title = title;
  $("authThemeToggleBtn").title = title;
}

let unsubscribeSnapshot = null;

function startFirestoreSync(uid){
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  const docRef = db.collection("users").doc(uid);
  unsubscribeSnapshot = docRef.onSnapshot((snap) => {
    if(snap.exists){
      state = Object.assign({plate:"", totalLoan:0, payments:[], theme:null}, snap.data());
    } else {
      state = { plate:"", totalLoan:0, payments:[], theme: state.theme || null };
      docRef.set(state);
    }
    if(!state.theme){
      state.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? "dark" : "light";
    }
    applyTheme(state.theme);
    render();
  }, (err) => {
    console.error("Firestore sync error:", err);
    const hint = err && err.code ? `（${err.code}）` : "";
    showToast(tr("cloudFail", {hint}));
  });
}

function stopFirestoreSync(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
}

$("authThemeToggleBtn").addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme(state.theme);
});

$("themeToggleBtn").addEventListener("click", async () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme(state.theme);
  await saveState();
});

async function saveState(){
  const user = auth.currentUser;
  if(!user) return;
  try{
    await db.collection("users").doc(user.uid).set(state);
  }catch(e){
    console.error("Firestore save error:", e);
    const hint = e && e.code ? `（${e.code}）` : "";
    showToast(tr("saveFail", {hint}));
  }
}

// ================== 登录 / 注册 / Google 登录 ==================
function showAuthError(msg){
  $("authError").textContent = msg || "";
}

function translateAuthError(err){
  const map = {
    "auth/invalid-email": "invalidEmail", "auth/user-not-found": "userNotFound", "auth/wrong-password": "wrongPassword",
    "auth/invalid-credential": "invalidCredential", "auth/email-already-in-use": "emailInUse", "auth/weak-password": "weakPassword",
    "auth/network-request-failed": "networkFailed", "auth/popup-closed-by-user": "loginCancelled", "auth/too-many-requests": "tooMany",
    "auth/missing-email": "missingEmail", "auth/user-disabled": "userDisabled"
  };
  return map[err.code] ? tr(map[err.code]) : (err.message || tr("loginFailed"));
}

// Keep Me Signed In: remember the email and password on this device when selected.
// The password field remains visually masked by type="password" until the eye icon is pressed.
const REMEMBER_EMAIL_KEY = "carLoanRememberedEmail";
const REMEMBER_PASSWORD_KEY = "carLoanRememberedPassword";
const rememberedEmail = localStorage.getItem(REMEMBER_EMAIL_KEY) || "";
const rememberedPassword = localStorage.getItem(REMEMBER_PASSWORD_KEY) || "";
if(rememberedEmail || rememberedPassword){
  $("authEmail").value = rememberedEmail;
  $("authPassword").value = rememberedPassword;
  $("authPassword").type = "password";
  $("keepSignedIn").checked = true;
}

// Unticking Keep Me Signed In immediately forgets and clears both fields.
$("keepSignedIn").addEventListener("change", () => {
  if(!$("keepSignedIn").checked){
    localStorage.removeItem(REMEMBER_EMAIL_KEY);
    localStorage.removeItem(REMEMBER_PASSWORD_KEY);
    $("authEmail").value = "";
    $("authPassword").value = "";
    $("authPassword").type = "password";
    $("eyeNormal").style.display = "block";
    $("eyeSlash").style.display = "none";
  }
});

// Use in-memory auth persistence so reopening the Android app shows the login screen.
// The remembered email is restored separately when Keep Me Signed In is checked.
auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch((e) => {
  console.warn("Could not set Firebase auth persistence:", e);
});

$("authLanguageBtn").addEventListener("click", () => applyLanguage(currentLanguage === "cn" ? "en" : "cn"));
$("mainLanguageBtn").addEventListener("click", () => applyLanguage(currentLanguage === "cn" ? "en" : "cn"));

$("passwordEyeBtn").addEventListener("click", () => {
  const showing = $("authPassword").type === "text";
  $("authPassword").type = showing ? "password" : "text";
  $("eyeNormal").style.display = showing ? "block" : "none";
  $("eyeSlash").style.display = showing ? "none" : "block";
  $("passwordEyeBtn").setAttribute("aria-label", tr(showing ? "showPassword" : "hidePassword"));
  $("passwordEyeBtn").title = tr(showing ? "showPassword" : "hidePassword");
});

if(!state.theme){

}

applyLanguage(currentLanguage);

$("forgotPasswordLink").addEventListener("click", async (e) => {
  e.preventDefault();
  showAuthError("");
  const email = $("authEmail").value.trim();
  if(!email){
    showAuthError(tr("enterEmailReset"));
    $("authEmail").focus();
    return;
  }
  try{
    await auth.sendPasswordResetEmail(email);
    showAuthError(tr("resetSent", {email}));
  }catch(err){
    showAuthError(translateAuthError(err));
  }
});

$("emailLoginBtn").addEventListener("click", async () => {
  showAuthError("");
  const email = $("authEmail").value.trim();
  const pass = $("authPassword").value;
  if(!email || !pass){ showAuthError(tr("enterEmailPass")); return; }
  try{
    if($("keepSignedIn").checked){
      localStorage.setItem(REMEMBER_EMAIL_KEY, email);
      localStorage.setItem(REMEMBER_PASSWORD_KEY, pass);
    }else{
      localStorage.removeItem(REMEMBER_EMAIL_KEY);
      localStorage.removeItem(REMEMBER_PASSWORD_KEY);
    }
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    showAuthError(translateAuthError(e));
  }
});

$("emailRegisterBtn").addEventListener("click", async () => {
  showAuthError("");
  const email = $("authEmail").value.trim();
  const pass = $("authPassword").value;
  if(!email || !pass){ showAuthError(tr("enterEmailPass")); return; }
  try{
    await auth.createUserWithEmailAndPassword(email, pass);
  }catch(e){
    showAuthError(translateAuthError(e));
  }
});

$("googleSignInBtn").addEventListener("click", async () => {
  showAuthError("");
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  }catch(e){
    // A cancelled Google sign-in is not an error. Return quietly to the login screen.
    const code = String((e && e.code) || "").toLowerCase();
    const message = String((e && e.message) || e || "").toLowerCase();
    const cancelled =
      code.includes("popup-closed-by-user") ||
      code.includes("cancelled-popup-request") ||
      code.includes("canceled") || code.includes("cancelled") ||
      code === "12501" ||
      message.includes("popup closed") ||
      message.includes("closed by the user") ||
      message.includes("user canceled") || message.includes("user cancelled") ||
      message.includes("sign in canceled") || message.includes("sign-in canceled") ||
      message.includes("sign in cancelled") || message.includes("sign-in cancelled") ||
      message.includes("12501");
    if(cancelled){
      showAuthError("");
      return;
    }
    console.error("Google 登录失败，完整错误：", e);
    let detail = "";
    try{ detail = JSON.stringify(e, Object.getOwnPropertyNames(e)); }catch(_){}
    showAuthError(translateAuthError(e) + (detail ? ("\n\n完整信息：" + detail) : ""));
  }
});

$("logoutBtn").addEventListener("click", async () => {
  const ok = await showConfirm(tr("logoutConfirm"), tr("logoutTitle"));
  if(!ok) return;
  await auth.signOut();
});

$("accountToggle").addEventListener("click", () => {

});

auth.onAuthStateChanged((user) => {
  if(user){
    document.body.classList.add("authed");
    $("accountEmailText").textContent = user.email ? `${tr("loggedIn")}: ${user.email}` : tr("loggedIn");
    if(!$("keepSignedIn").checked){
      $("authEmail").value = "";
      $("authPassword").value = "";
    }
    showAuthError("");
    startFirestoreSync(user.uid);
  } else {
    document.body.classList.remove("authed");
    stopFirestoreSync();
    if($("keepSignedIn").checked){
      $("authEmail").value = localStorage.getItem(REMEMBER_EMAIL_KEY) || "";
      $("authPassword").value = localStorage.getItem(REMEMBER_PASSWORD_KEY) || "";
      $("authPassword").type = "password";
      $("eyeNormal").style.display = "block";
      $("eyeSlash").style.display = "none";
    }else{
      $("authEmail").value = "";
      $("authPassword").value = "";
    }
  }
});

function showToast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove("show"), 1800);
}

function render(){
  $("plateInput").value = state.plate || "";
  $("totalInput").value = state.totalLoan || "";
  $("plateChip").textContent = state.plate ? state.plate : tr("unsetPlate");

  const totalPaid = state.payments.reduce((s,p)=> s + Number(p.amount||0), 0);
  const remaining = Math.max(Number(state.totalLoan||0) - totalPaid, 0);
  const pct = state.totalLoan > 0 ? Math.min(totalPaid / state.totalLoan, 1) : 0;

  $("totalText").textContent = fmt(state.totalLoan);
  $("paidText").textContent = fmt(totalPaid);
  $("remainText").textContent = fmt(remaining);
  $("countText").textContent = state.payments.length;
  $("pctText").textContent = Math.round(pct*100) + "%";

  const circumference = 289;
  $("ring").style.strokeDashoffset = circumference - (pct * circumference);

  updatePayoffEstimate(remaining, totalPaid);

  const list = $("historyList");
  if(state.payments.length === 0){
    list.innerHTML = '<div class="empty-state" data-i18n="noPayments">还没有还款记录，添加第一笔吧。</div>';
    return;
  }
  const sorted = [...state.payments].sort((a,b)=> (a.date < b.date ? 1 : -1));
  list.innerHTML = sorted.map(p => `
    <div class="history-item" data-id="${p.id}">
      <div class="dot"></div>
      <div class="info">
        <div class="date">${p.date}</div>
        ${p.note ? `<div class="note">${escapeHtml(p.note)}</div>` : ""}
      </div>
      <div class="amt">${fmt(p.amount)}</div>
      <button class="btn-edit-text" onclick="editPayment('${p.id}')">${tr("edit")}</button>
      <button class="btn-danger-text" onclick="deletePayment('${p.id}')">${tr("delete")}</button>
    </div>
  `).join("");
}

// 根据实际还款记录，自动算出"按目前的还款速度"大约还要多久还清
function updatePayoffEstimate(remaining, totalPaid){
  const el = $("payoffText");

  if(!state.totalLoan){
    el.textContent = "--";
    return;
  }
  if(remaining <= 0){
    el.textContent = tr("fullyPaid");
    return;
  }
  if(state.payments.length === 0){
    el.textContent = tr("noPaymentYet");
    return;
  }

  // 计算从第一笔还款到今天，一共经过了几个月，取平均每月还款额
  const dates = state.payments.map(p => new Date(p.date + "T00:00:00"));
  const firstDate = new Date(Math.min(...dates));
  const today = new Date();
  let monthsElapsed = (today.getFullYear() - firstDate.getFullYear()) * 12
                      + (today.getMonth() - firstDate.getMonth()) + 1;
  monthsElapsed = Math.max(monthsElapsed, 1);

  const avgMonthly = totalPaid / monthsElapsed;

  if(avgMonthly <= 0){
    el.textContent = tr("insufficientRate");
    return;
  }

  const monthsLeft = Math.ceil(remaining / avgMonthly);
  const years = Math.floor(monthsLeft / 12);
  const remMonths = monthsLeft % 12;

  let text = "";
  if(years > 0 && remMonths > 0){
    text = currentLanguage === "en" ? `${years} ${tr("year")}${years === 1 ? "" : "s"} ${remMonths} ${tr("month")}${remMonths === 1 ? "" : "s"}` : `${years} ${tr("year")} ${remMonths} ${tr("month")}`;
  } else if(years > 0){
    text = currentLanguage === "en" ? `${years} ${tr("year")}${years === 1 ? "" : "s"}` : `${years} ${tr("year")}`;
  } else {
    text = currentLanguage === "en" ? `${remMonths} ${tr("month")}${remMonths === 1 ? "" : "s"}` : `${remMonths} ${tr("month")}`;
  }

  el.textContent = text;
  el.title = tr("avgMonthlyTitle", {amount: fmt(avgMonthly)});
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showConfirm(message, title){
  return new Promise((resolve) => {
    $("confirmTitle").textContent = title || tr("confirmAction");
    $("confirmMessage").textContent = message;
    $("confirmOverlay").classList.add("show");

    function cleanup(result){
      $("confirmOverlay").classList.remove("show");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      resolve(result);
    }
    const okBtn = $("confirmOkBtn");
    const cancelBtn = $("confirmCancelBtn");
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
  });
}

let editingPaymentId = null;

async function deletePayment(id){
  state.payments = state.payments.filter(p => p.id !== id);
  if(editingPaymentId === id) exitEditMode();
  render();
  await saveState();
  showToast(tr("deleted"));
}
window.deletePayment = deletePayment;

function editPayment(id){
  const p = state.payments.find(p => p.id === id);
  if(!p) return;
  editingPaymentId = id;
  $("payAmount").value = p.amount;
  $("payDate").value = p.date;
  $("payNote").value = p.note || "";
  $("payCardTitle").textContent = tr("editPayment");
  $("addPayBtn").textContent = tr("saveChanges");
  $("cancelEditBtn").style.display = "inline-block";
  $("payAmount").focus();
}
window.editPayment = editPayment;

function exitEditMode(){
  editingPaymentId = null;
  $("payCardTitle").textContent = tr("recordPayment");
  $("addPayBtn").textContent = tr("addPayment");
  $("cancelEditBtn").style.display = "none";
  $("payAmount").value = "";
  $("payNote").value = "";
  $("payDate").value = todayStr();
}

$("cancelEditBtn").addEventListener("click", () => {
  exitEditMode();
});

$("settingsToggle").addEventListener("click", () => {
  $("settingsToggle").classList.toggle("open");
  $("settingsBody").classList.toggle("open");
});

$("saveSettingsBtn").addEventListener("click", async () => {
  const plate = $("plateInput").value.trim();
  const total = parseFloat($("totalInput").value);
  if(!plate){
    showToast(tr("enterPlate"));
    return;
  }
  if(isNaN(total) || total < 0){
    showToast(tr("invalidTotal"));
    return;
  }
  state.plate = plate;
  state.totalLoan = total;
  render();
  await saveState();
  showToast(tr("settingsSaved"));
});

$("clearSettingsBtn").addEventListener("click", async () => {
  if(!state.plate && !state.totalLoan){
    showToast(tr("noSavedPlate"));
    return;
  }
  const ok = await showConfirm(tr("clearConfirm"), tr("clearPlateTitle"));
  if(!ok) return;
  state.plate = "";
  state.totalLoan = 0;
  render();
  await saveState();
  showToast(tr("plateCleared"));
});

$("addPayBtn").addEventListener("click", async () => {
  const amount = parseFloat($("payAmount").value);
  const date = $("payDate").value || todayStr();
  const note = $("payNote").value.trim();
  if(isNaN(amount) || amount <= 0){
    showToast(tr("invalidPayment"));
    return;
  }
  if(date > todayStr()){
    showToast(tr("futureDate"));
    return;
  }

  if(editingPaymentId){
    const p = state.payments.find(p => p.id === editingPaymentId);
    if(p){
      p.amount = amount;
      p.date = date;
      p.note = note;
    }
    exitEditMode();
    render();
    await saveState();
    showToast(tr("paymentUpdated"));
  } else {
    state.payments.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      amount, date, note
    });
    $("payAmount").value = "";
    $("payNote").value = "";
    render();
    await saveState();
    showToast(tr("paymentAdded"));
  }
});

$("payDate").max = todayStr();
$("payDate").value = todayStr();
