<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>We Save</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A22">
<link rel="icon" href="icons/favicon-32.png">

<!-- iOS doesn't read the web manifest, so it needs its own tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="We Save">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1E2A22;
    --ink-soft:#4A5A4D;
    --paper:#F2F0E6;
    --paper-raised:#EAE7D8;
    --line:#C9C4AE;
    --line-soft:#DAD6C4;
    --mustard:#C98A2C;
    --mustard-deep:#8C5F1A;
    --moss:#2F7A5B;
    --moss-deep:#1F5440;
    --clay:#B0492F;
    --clay-deep:#7A3320;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:2.5rem 1.5rem 4rem;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;}
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--ink);
    padding-bottom:0.75rem;
    margin-bottom:1.75rem;
  }
  .masthead h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0;
    letter-spacing:0.01em;
  }
  .masthead .today{
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .balance-block{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:2rem;
    flex-wrap:wrap;
    gap:1rem;
  }
  .balance-main .label{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin-bottom:0.15rem;
  }
  .balance-main .amount{
    font-family:'Source Serif 4',serif;
    font-size:2.75rem;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .mini-stats{display:flex;gap:1.75rem;}
  .mini-stats div .label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);}
  .mini-stats div .val{font-family:'Source Serif 4',serif;font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums;}
  .mini-stats .in .val{color:var(--moss-deep);}
  .mini-stats .out .val{color:var(--clay-deep);}

  .panel{margin-bottom:2.25rem;}
  .panel-title{
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin-bottom:0.75rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  form.entry{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0.6rem 0.75rem;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1rem;
  }
  form.entry .full{grid-column:1/-1;}
  .type-toggle{display:flex;gap:0;grid-column:1/-1;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .type-toggle button{
    flex:1;
    padding:0.5rem;
    border:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .type-toggle button.active.income{background:var(--moss);color:#fff;}
  .type-toggle button.active.expense{background:var(--clay);color:#fff;}

  label{font-size:0.7rem;color:var(--ink-soft);display:block;margin-bottom:0.25rem;}
  input,select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    padding:0.45rem 0.5rem;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--mustard);outline-offset:1px;}
  .add-btn{
    grid-column:1/-1;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:0.6rem;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .add-btn:hover{background:var(--moss-deep);}

  input.field-error, select.field-error{
    border-color:var(--clay-deep)!important;
    outline:2px solid var(--clay-deep);
    outline-offset:1px;
  }
  .form-error-msg{
    grid-column:1/-1;
    color:var(--clay-deep);
    font-size:0.78rem;
    margin-top:-0.3rem;
  }
  .form-error-msg.hidden{display:none;}

  .ledger{border-top:2px solid var(--ink);}
  .row{
    display:grid;
    grid-template-columns:52px 1fr auto 24px;
    gap:0.75rem;
    align-items:center;
    padding:0.65rem 0.15rem;
    border-bottom:1px solid var(--line-soft);
    font-size:0.88rem;
  }
  .row .date{color:var(--ink-soft);font-size:0.75rem;}
  .row .desc{font-weight:500;}
  .row .cat{color:var(--ink-soft);font-size:0.75rem;display:block;}
  .row .amt{font-variant-numeric:tabular-nums;font-weight:500;text-align:right;}
  .row .amt.income{color:var(--moss-deep);}
  .row .amt.expense{color:var(--clay-deep);}
  .row .del{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:1rem;
    line-height:1;padding:0;
  }
  .row .del:hover{color:var(--clay-deep);}
  .empty-row{padding:1.25rem 0;color:var(--ink-soft);font-size:0.85rem;text-align:center;}

  .budgets{display:flex;flex-direction:column;gap:0.9rem;}
  .budget-item{}
  .budget-head{display:flex;justify-content:space-between;align-items:center;font-size:0.83rem;margin-bottom:0.3rem;}
  .budget-head .cat-name{font-weight:500;}
  .budget-head .right{display:flex;align-items:center;gap:0.5rem;}
  .budget-head .fig{font-variant-numeric:tabular-nums;color:var(--ink-soft);}
  .budget-head .icon-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    font-size:0.78rem;padding:0;line-height:1;
  }
  .budget-head .icon-btn:hover{color:var(--ink);}
  .budget-head .icon-btn.del-budget:hover{color:var(--clay-deep);}
  .bar-track{height:7px;border-radius:4px;background:var(--paper-raised);border:1px solid var(--line);overflow:hidden;}
  .bar-fill{height:100%;background:var(--moss);}
  .bar-fill.over{background:var(--clay);}
  .budget-set{
    display:flex;
    gap:0.5rem;
    margin-top:1rem;
  }
  .budget-set select{flex:1.2;}
  .budget-set input{flex:0.8;}
  .budget-set button{
    background:var(--mustard);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:0 0.9rem;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
  }
  .budget-set button:hover{background:var(--mustard-deep);}

  #authScreen{
    max-width:340px;
    margin:4rem auto;
    padding:1.75rem;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
  }
  #authScreen h1{
    font-family:'Source Serif 4',serif;
    font-size:1.4rem;
    font-weight:600;
    margin:0 0 1.25rem;
    text-align:center;
  }
  #authScreen label{margin-top:0.6rem;}
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:2.2rem;}
  .password-toggle{
    position:absolute;right:0.45rem;top:50%;transform:translateY(-50%);
    width:1.4rem;height:1.4rem;padding:0;border:none;background:transparent;
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .password-toggle:hover{color:var(--ink);}
  .password-toggle svg{width:17px;height:17px;display:block;}
  .password-toggle .icon-eye-closed{display:none;}
  .password-toggle.showing .icon-eye-open{display:none;}
  .password-toggle.showing .icon-eye-closed{display:block;}
  .auth-options-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:0.5rem;
    margin-top:0.6rem;
  }
  .remember-label{
    display:flex;
    align-items:center;
    gap:0.45rem;
    font-size:0.8rem;
    color:var(--ink-soft);
    cursor:default;
    user-select:none;
  }
  .remember-label input{
    width:13px;
    height:13px;
    margin:0;
    padding:0;
    appearance:auto;
    -webkit-appearance:auto;
    border:none;
    outline:none;
    box-shadow:none;
    background:transparent;
    border-radius:0;
    box-sizing:border-box;
    cursor:pointer;
    flex:0 0 13px;
  }
  .forgot-link{color:var(--ink-soft);font-size:0.78rem;text-decoration:underline;cursor:pointer;white-space:nowrap;}
  .forgot-link:hover{color:var(--clay-deep);}
  #authScreen .auth-actions{
    display:flex;
    gap:0.6rem;
    margin-top:1.1rem;
  }
  #authScreen .auth-actions button{
    flex:1;
    border:none;
    border-radius:4px;
    padding:0.55rem;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
  }
  #loginBtn{background:var(--ink);color:var(--paper);}
  #loginBtn:hover{background:var(--moss-deep);}
  #signupBtn{background:transparent;color:var(--ink);border:1px solid var(--line)!important;}
  #signupBtn:hover{border-color:var(--ink)!important;}
  #authError{
    color:var(--clay-deep);
    font-size:0.8rem;
    margin-top:0.75rem;
    min-height:1.1em;
    text-align:center;
  }
  #authStatus{
    font-size:0.8rem;
    color:var(--ink-soft);
    text-align:center;
    margin-top:0.75rem;
  }
  .logout-link{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:0.75rem;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
    margin-left:0.75rem;
  }
  .logout-link:hover{color:var(--clay-deep);}
  .hidden{display:none!important;}
  #forgotScreen{max-width:340px;margin:4rem auto;padding:1.75rem;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);}
  #forgotScreen h1{font-family:'Source Serif 4',serif;font-size:1.4rem;text-align:center;margin:0 0 1.25rem;}
  .secondary-btn{width:100%;margin-top:.65rem;padding:.55rem;border:1px solid var(--line);background:transparent;border-radius:4px;cursor:pointer;font-weight:600;color:var(--ink);}
  .secondary-btn:hover{border-color:var(--ink);}

  .oauth-divider{
    display:flex;
    align-items:center;
    gap:0.6rem;
    margin:1.25rem 0 0.9rem;
    color:var(--ink-soft);
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .oauth-divider::before,
  .oauth-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .oauth-buttons{display:flex;flex-direction:column;gap:0.55rem;}
  .oauth-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.6rem;
    width:100%;
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:0.55rem;
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
  }
  .oauth-btn:hover{border-color:var(--ink);}
  .oauth-btn svg{width:18px;height:18px;flex-shrink:0;}
  #facebookBtn{background:#1877F2;border-color:#1877F2;color:#fff;}
  #facebookBtn:hover{background:#1461C9;}
</style>
</head>
<body>

<div id="authScreen">
  <h1>We Save</h1>
  <label>Email</label>
  <input type="email" id="authEmail" placeholder="" autocomplete="username">
  <label>Password</label>
  <div class="password-wrap">
    <input type="password" id="authPassword" placeholder="" autocomplete="current-password">
    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" title="Show password">
      <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
        <circle cx="12" cy="12" r="2.5"></circle>
      </svg>
      <svg class="icon-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
        <circle cx="12" cy="12" r="2.5"></circle>
        <line x1="2.5" y1="2.5" x2="21.5" y2="21.5"></line>
      </svg>
    </button>
  </div>
  <div class="auth-options-row">
    <div class="remember-label"><input type="checkbox" id="rememberMe" checked> <span>Keep me signed in</span></div>
    <a class="forgot-link" href="#" id="forgotLink">Forgot Password?</a>
  </div>
  <div class="auth-actions">
    <button type="button" id="loginBtn">Login</button>
    <button type="button" id="signupBtn">Create account</button>
  </div>
  <div id="authError"></div>
  <div id="authStatus"></div>

  <div class="oauth-divider">or continue with</div>
  <div class="oauth-buttons">
    <button type="button" class="oauth-btn" id="googleBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.5-.2-3-.4-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.7 0-14.4 4.3-17.7 10.2z"/><path fill="#4CAF50" d="M24 45.5c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 36.7 26.9 37.5 24 37.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 40.9 16.2 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C41.7 36.4 44.5 31.2 44.5 25c0-1.5-.2-3-.4-4.5z"/></svg>
      Sign in with Google
    </button>
    <button type="button" class="oauth-btn" id="facebookBtn">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M22 12c0-5.5-4.5-10-10-10S2 6.5 2 12c0 5 3.7 9.1 8.4 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7C18.3 21.1 22 17 22 12z"/></svg>
      Continue with Facebook
    </button>
  </div>
</div>

<div id="forgotScreen" class="hidden">
  <h1>Reset Password</h1>
  <label>Email</label>
  <input type="email" id="resetEmail" placeholder="Enter your account email" autocomplete="email">
  <button type="button" class="add-btn" id="resetBtn" style="width:100%;margin-top:1rem;">Send Reset Email</button>
  <button type="button" class="secondary-btn" id="backToLoginBtn">Back to Login</button>
  <div id="resetError"></div>
  <div id="resetStatus"></div>
</div>

<div class="wrap hidden" id="appScreen">

  <div class="masthead">
    <h1>We Save</h1>
    <div class="today">
      <span id="todayLabel"></span>
      <button type="button" class="logout-link" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="balance-block">
    <div class="balance-main">
      <div class="label">Balance</div>
      <div class="amount" id="balanceAmt">RM0.00</div>
    </div>
    <div class="mini-stats">
      <div class="in"><div class="label">In this month</div><div class="val" id="monthIn">RM0.00</div></div>
      <div class="out"><div class="label">Out this month</div><div class="val" id="monthOut">RM0.00</div></div>
    </div>
  </div>

  <div class="panel">
    <form class="entry" id="entryForm" novalidate>
      <div class="type-toggle full">
        <button type="button" class="active expense" data-type="expense">Expense</button>
        <button type="button" class="income" data-type="income">Income</button>
      </div>
      <div class="full">
        <label>Description</label>
        <input type="text" id="descInput" placeholder="Groceries, salary, rent..." required>
      </div>
      <div>
        <label>Amount</label>
        <input type="number" id="amtInput" placeholder="0.00" step="0.01" min="0.01" required>
      </div>
      <div>
        <label>Category</label>
        <select id="catInput">
          <option>Food</option>
          <option>Transport</option>
          <option>Housing</option>
          <option>Utilities</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Income</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label>Who</label>
        <select id="personInput">
          <option>Gary</option>
          <option>Kiki</option>
        </select>
      </div>
      <div>
        <label>Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-error-msg hidden" id="formErrorMsg">Please fill out all required fields.</div>
      <button type="submit" class="add-btn">Add to ledger</button>
    </form>
  </div>

  <div class="panel">
    <div class="panel-title">
      <span>Category budgets — this month</span>
    </div>
    <div class="budgets" id="budgetsList"></div>
    <div class="budget-set">
      <select id="budgetCat">
        <option>Food</option>
        <option>Transport</option>
        <option>Housing</option>
        <option>Utilities</option>
        <option>Entertainment</option>
        <option>Health</option>
        <option>Other</option>
      </select>
      <input type="number" id="budgetAmt" placeholder="Budget RM" step="1" min="0">
      <button type="button" id="setBudgetBtn">Set</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Transactions</div>
    <div class="ledger" id="ledgerList"></div>
  </div>

</div>

<script>
// ---- Firebase setup ----
// Paste the config object Firebase gave you when you registered the web app.
const firebaseConfig = {
  apiKey: "AIzaSyBbhKX9m67hPecVUAVRhcBAPJjxPDM8Zio",
  authDomain: "wesave-ee5fd.firebaseapp.com",
  databaseURL: "https://wesave-ee5fd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wesave-ee5fd",
  storageBucket: "wesave-ee5fd.firebasestorage.app",
  messagingSenderId: "797814401717",
  appId: "1:797814401717:web:df3c03fa40148a6d086cfc"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const passwordInput = document.getElementById('authPassword');
const passwordToggle = document.getElementById('passwordToggle');
passwordToggle.addEventListener('click', () => {
  const showing = passwordInput.type === 'text';
  passwordInput.type = showing ? 'password' : 'text';
  passwordToggle.classList.toggle('showing', !showing);
  passwordToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  passwordToggle.setAttribute('title', showing ? 'Show password' : 'Hide password');
});

let transactions = [];
let budgets = {};
let currentType = 'expense';
let unsubscribeSnapshot = null;
let currentDocRef = null;
let suppressNextSave = false;

function fmt(n){
  const sign = n < 0 ? '-' : '';
  return sign + 'RM' + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
const todayStr = new Date().toISOString().slice(0,10);
document.getElementById('dateInput').value = todayStr;
document.getElementById('dateInput').max = todayStr;

document.querySelectorAll('.type-toggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
  });
});

// ---- Auth screen wiring ----
const authScreen = document.getElementById('authScreen');
const appScreen = document.getElementById('appScreen');
const authError = document.getElementById('authError');
const authStatus = document.getElementById('authStatus');
const forgotScreen = document.getElementById('forgotScreen');
const resetEmail = document.getElementById('resetEmail');
const resetError = document.getElementById('resetError');
const resetStatus = document.getElementById('resetStatus');

function showLogin(){ authScreen.classList.remove('hidden'); forgotScreen.classList.add('hidden'); resetError.textContent=''; resetStatus.textContent=''; }
function showForgot(){ authScreen.classList.add('hidden'); appScreen.classList.add('hidden'); forgotScreen.classList.remove('hidden'); resetEmail.value=document.getElementById('authEmail').value.trim(); resetEmail.focus(); }
document.getElementById('forgotLink').addEventListener('click',e=>{e.preventDefault();showForgot();});
document.getElementById('backToLoginBtn').addEventListener('click',showLogin);
document.getElementById('resetBtn').addEventListener('click',()=>{
  const email=resetEmail.value.trim(); resetError.textContent=''; resetStatus.textContent='';
  if(!email){resetError.textContent='Please enter your email address.';return;}
  resetStatus.textContent='Sending reset email...';
  auth.sendPasswordResetEmail(email).then(()=>{resetStatus.textContent='Password reset email sent. Check your inbox.';}).catch(err=>{resetStatus.textContent='';resetError.textContent=err.message;});
});

function setAuthBusy(msg){
  authStatus.textContent = msg || '';
  authError.textContent = '';
}
function setAuthError(err){
  authStatus.textContent = '';
  authError.textContent = err;
}

// Closing/cancelling a Google or Facebook sign-in is a normal user action.
// Do not show Firebase's technical popup-cancel error on the login screen.
function handleOAuthError(err){
  const code = err && err.code ? err.code : '';
  if(code === 'auth/popup-closed-by-user' ||
     code === 'auth/cancelled-popup-request' ||
     code === 'auth/user-cancelled'){
    setAuthBusy('');
    return;
  }
  setAuthError(err && err.message ? err.message : 'Sign-in could not be completed.');
}

function applyPersistence(){
  const remember = document.getElementById('rememberMe').checked;
  const email = document.getElementById('authEmail').value.trim();

  if(remember && email) {
    localStorage.setItem('wesaveRememberedEmail', email);
    // Save the password only when Keep me signed in is checked.
    // Note: localStorage is not encrypted.
    localStorage.setItem('wesaveRememberedPassword', document.getElementById('authPassword').value);
  } else {
    localStorage.removeItem('wesaveRememberedEmail');
    localStorage.removeItem('wesaveRememberedPassword');
  }

  return auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
}

function loadRememberedEmail(){
  const email = localStorage.getItem('wesaveRememberedEmail');
  const password = localStorage.getItem('wesaveRememberedPassword');
  document.getElementById('authEmail').value = email || '';
  document.getElementById('authPassword').value = password || '';
  document.getElementById('rememberMe').checked = !!email;
}
loadRememberedEmail();

document.getElementById('rememberMe').addEventListener('change', ()=>{
  if(!document.getElementById('rememberMe').checked){
    localStorage.removeItem('wesaveRememberedEmail');
    localStorage.removeItem('wesaveRememberedPassword');
    // Clear both fields immediately when Keep me signed in is unticked.
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
  }
});

document.getElementById('loginBtn').addEventListener('click', ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ setAuthError('Enter both email and password.'); return; }
  setAuthBusy('Logging in...');
  applyPersistence()
    .then(()=> auth.signInWithEmailAndPassword(email, password))
    .catch(err => setAuthError(err.message));
});

document.getElementById('signupBtn').addEventListener('click', ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ setAuthError('Enter both email and password.'); return; }
  if(password.length < 6){ setAuthError('Password needs at least 6 characters.'); return; }
  setAuthBusy('Creating account...');
  applyPersistence()
    .then(()=> auth.createUserWithEmailAndPassword(email, password))
    .catch(err => setAuthError(err.message));
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  auth.signOut();
});

// Popups are unreliable on mobile browsers (privacy-focused browsers like
// Brave, and mobile Safari/Chrome in general, often block the popup's
// postMessage handshake back to this page). Use a full-page redirect on
// mobile instead, and keep the popup on desktop where it works fine.
function isMobileBrowser(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function startOAuthSignIn(provider, label){
  setAuthBusy(`Opening ${label} sign-in...`);
  applyPersistence().then(()=>{
    if(isMobileBrowser()){
      auth.signInWithRedirect(provider);
    } else {
      auth.signInWithPopup(provider).catch(handleOAuthError);
    }
  });
}

document.getElementById('googleBtn').addEventListener('click', ()=>{
  startOAuthSignIn(new firebase.auth.GoogleAuthProvider(), 'Google');
});

document.getElementById('facebookBtn').addEventListener('click', ()=>{
  startOAuthSignIn(new firebase.auth.FacebookAuthProvider(), 'Facebook');
});

// Handle the mobile redirect result. A cancelled/closed Facebook or Google
// flow returns to the login screen quietly; a successful result is handled
// by onAuthStateChanged below.
auth.getRedirectResult()
  .then(result => {
    if(!result || !result.user) setAuthBusy('');
  })
  .catch(handleOAuthError);

// Keep Firebase's existing session on page reload.
// Do NOT sign the user out automatically during startup.
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
  .catch(err=>console.warn('Auth initialization warning:', err));

auth.onAuthStateChanged(user=>{
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  if(user){
    authScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    if(!document.getElementById('rememberMe').checked){
      document.getElementById('authEmail').value = '';
    }
    document.getElementById('authPassword').value = '';
    currentDocRef = db.collection('users').doc(user.uid);
    unsubscribeSnapshot = currentDocRef.onSnapshot(doc=>{
      const data = doc.data() || {};
      transactions = data.transactions || [];
      budgets = data.budgets || {};
      render();
    }, err=>{
      console.error('Firestore sync error', err);
      setAuthError('');
    });
  } else {
    appScreen.classList.add('hidden');
    authScreen.classList.remove('hidden');
    currentDocRef = null;
    transactions = [];
    budgets = {};
    setAuthBusy('');
  }
});

function saveTransactions(){
  if(!currentDocRef) return;
  currentDocRef.set({ transactions }, { merge: true })
    .catch(e=> console.error('Could not save transactions', e));
}
function saveBudgets(){
  if(!currentDocRef) return;
  currentDocRef.set({ budgets }, { merge: true })
    .catch(e=> console.error('Could not save budgets', e));
}

function render(){
  const balance = transactions.reduce((s,t)=> s + (t.type==='income'? t.amount : -t.amount), 0);
  document.getElementById('balanceAmt').textContent = fmt(balance);

  const now = new Date();
  const inMonth = transactions.filter(t=>{
    const d = new Date(t.date);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });
  const monthIn = inMonth.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const monthOut = inMonth.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  document.getElementById('monthIn').textContent = fmt(monthIn);
  document.getElementById('monthOut').textContent = fmt(monthOut);

  const ledger = document.getElementById('ledgerList');
  ledger.innerHTML = '';
  if(transactions.length===0){
    ledger.innerHTML = '<div class="empty-row">No transactions yet. Add your first one above.</div>';
  } else {
    const sorted = [...transactions].sort((a,b)=> new Date(b.date) - new Date(a.date));
    sorted.forEach(t=>{
      const row = document.createElement('div');
      row.className = 'row';
      const d = new Date(t.date);
      const dateStr = d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
      row.innerHTML = `
        <div class="date">${dateStr}</div>
        <div><span class="desc">${escapeHtml(t.desc)}</span><span class="cat">${t.category}${t.person ? ' · ' + t.person : ''}</span></div>
        <div class="amt ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div>
        <button class="del" aria-label="Delete transaction" data-id="${t.id}">×</button>
      `;
      ledger.appendChild(row);
    });
    ledger.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        transactions = transactions.filter(t=>String(t.id)!==btn.dataset.id);
        saveTransactions();
        render();
      });
    });
  }

  const budgetCats = Object.keys(budgets);
  const budgetsList = document.getElementById('budgetsList');
  budgetsList.innerHTML = '';
  if(budgetCats.length===0){
    budgetsList.innerHTML = '<div class="empty-row" style="padding:0.5rem 0;">No budgets set. Add one below.</div>';
  } else {
    budgetCats.forEach(cat=>{
      const spent = inMonth.filter(t=>t.type==='expense' && t.category===cat).reduce((s,t)=>s+t.amount,0);
      const limit = budgets[cat];
      const pct = Math.min(100, (spent/limit)*100 || 0);
      const over = spent > limit;
      const item = document.createElement('div');
      item.className = 'budget-item';
      item.innerHTML = `
        <div class="budget-head">
          <span class="cat-name">${cat}</span>
          <div class="right">
            <span class="fig">${fmt(spent)} / ${fmt(limit)}</span>
            <button type="button" class="icon-btn del-budget" data-cat="${cat}" aria-label="Delete budget for ${cat}">×</button>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      `;
      budgetsList.appendChild(item);
    });
    budgetsList.querySelectorAll('.del-budget').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const cat = btn.dataset.cat;
        if(!confirm(`Remove the budget set for ${cat}?`)) return;
        delete budgets[cat];
        saveBudgets();
        render();
      });
    });
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('entryForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const descEl = document.getElementById('descInput');
  const amtEl = document.getElementById('amtInput');
  const errorEl = document.getElementById('formErrorMsg');

  const desc = descEl.value.trim();
  const amount = parseFloat(amtEl.value);
  const category = document.getElementById('catInput').value;
  const person = document.getElementById('personInput').value;
  const date = document.getElementById('dateInput').value || todayStr;

  descEl.classList.remove('field-error');
  amtEl.classList.remove('field-error');
  errorEl.classList.add('hidden');

  let message = '';
  if(!desc) { descEl.classList.add('field-error'); message = 'Please fill out all required fields.'; }
  if(!amount || amount<=0) { amtEl.classList.add('field-error'); message = 'Please fill out all required fields.'; }
  if(date > todayStr) { message = 'Date cannot be in the future.'; }

  if(message){
    errorEl.textContent = message;
    errorEl.classList.remove('hidden');
    (!desc ? descEl : amtEl).focus();
    return;
  }

  transactions.push({ id: Date.now(), desc, amount, category, person, type: currentType, date });
  saveTransactions();
  descEl.value='';
  amtEl.value='';
  render();
});

document.getElementById('setBudgetBtn').addEventListener('click', ()=>{
  const cat = document.getElementById('budgetCat').value;
  const amt = parseFloat(document.getElementById('budgetAmt').value);
  if(!amt || amt<=0) return;
  budgets[cat] = amt;
  saveBudgets();
  document.getElementById('budgetAmt').value='';
  render();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW registration failed', err));
  });
}
</script>
</body>
</html>
